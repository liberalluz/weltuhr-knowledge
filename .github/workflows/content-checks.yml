name: content-checks

# Content pipeline gate. fixtures are the bulk of this job: a red negative case
# means some criterion was widened.
# Once a real space lands, the last step picks up the build automatically
# (dist/ is not committed, artifacts are only verified in CI).
#
# Same reason for no workflow-level `paths` as in the head of
# `app-checks.yml` -- in one line: when `paths` does not match the check
# produces no conclusion, and a required check then stays pending forever. The
# trigger surface is decided inside the job by `tool/ci/affected.py`.
#
# "Artifacts are not committed" used to live at the end of this job and has
# **moved to `repo-hygiene.yml`**: its input is repo-wide `git` state rather
# than `content/`, so keeping it here would tie it to this job's change surface
# -- a PR touching only `app/` would miss it. It needs nothing but `git`, takes
# about 5 s, and does not deserve any filter of its own.

on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest run per branch so nobody queues behind old commits.
concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-checks:
    name: content-checks
    runs-on: ubuntu-latest
    # No bytecode at all: content/tools/*.py importing each other writes
    # __pycache__/, which is a tool cache rather than a deliverable and should
    # not fall under the "artifacts are not committed" criterion.
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Same as `app-checks`: the `base...HEAD` merge-base needs more than
          # the default depth 1.
          fetch-depth: 0

      # Detection runs before installing python: the python3 that ships with
      # `ubuntu-latest` is enough for the criterion (stdlib only), so a skipped
      # PR costs checkout plus about a second.
      # `--root .`: this job has no `defaults.working-directory`, so cwd is the
      # repo root; without it the script looks for the default `..` parent.
      - name: 判改动面
        id: scope
        run: python3 app/tool/ci/affected.py --scope content --root . --base "$BASE" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.13"

      # No third-party dependencies, nothing to install
      - name: fixtures 回归
        if: steps.scope.outputs.run == 'true'
        run: python content/tools/verify.py --suite

      - name: 确定性检查
        if: steps.scope.outputs.run == 'true'
        run: python content/tools/build.py --root content/tools/fixtures/valid-min --check

      - name: 构建全部空间
        if: steps.scope.outputs.run == 'true'
        run: |
          if ls content/*/manifest.json >/dev/null 2>&1; then
            python content/tools/build.py
          else
            echo "尚无真实空间（content/*/manifest.json），跳过"
          fi
