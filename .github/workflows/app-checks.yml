name: app-checks

# 客户端架构门禁。四件事在这里强制，而不是靠「记得手动跑」：
#   ① analyze  —— 严格模式（strict-casts / strict-inference / strict-raw-types）
#   ② tool/lint —— core 的架构不变量：R1 核心层不得反向依赖、R2 核心层禁止数字字面量。
#      它是独立脚本而非 custom_lint 插件，**analyze 抓不到**，漏掉这一行
#      等于「core 无 Flutter import」这条只写在文档里。
#   ③ tool/docs —— 四份交付物之间的口径对账（`D1`–`D4`）。`analyze` 与 `tool/lint`
#      都只看 Dart 源码，看不见「`STD` 说多少条、`STP` 汇总多少条」这类错 ——
#      而那四份是 Markdown。
#   ④ test     —— core、实体、事件与 lint 规则自身的回归
#
# 不跑 `dart format --set-exit-if-changed`：仓库当前不是 format-clean
# （实跑 17 份里 12 份会被改，疑与 Dart 3.7+ tall style 有关）。
# 接入前必须先单独一笔把格式化做完，否则这个 job 从第一天就是红的，
# 而一个常态为红的门禁等于没有门禁。
#
# ── 为什么**没有** `paths:` ────────────────────────────────────────────
# 触发面交给 `tool/ci/affected.py` 在 job 内判断，而不是写在 workflow 上。
# 不是风格问题：`paths` 未命中时整个 workflow **不运行**，check 也就**不产生结论**；
# 分支保护一旦把它设成 required，只改 `docs/` 的 PR 会永远停在
# "Expected — Waiting for status to be reported"，合不了。
# 现在 job 恒运行、恒回报 success，跳过只发生在内部步骤 —— 设不设 required 都对。

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时只保留最新一次，避免排队等旧提交。
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: app-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # 判改动面要算 `base...HEAD` 的 merge-base，默认 `depth: 1` 拿不到。
          # 拿不到时脚本会降级成「全跑」—— 不至于漏检，但判据形同虚设，
          # 所以这里必须是 0，不能省。
          fetch-depth: 0

      # 判据先自证再判别人：`scopes.json` 被改窄（比如漏了 `content/`）时，
      # 判断照样"跑得通"，只是永远判成「不相关」—— 这正是最坏的失效形态。
      # 自检是普通断言，不依赖 git，约 0.2 秒。
      - name: 判据自检
        run: python3 tool/ci/affected.py --self-test

      # 判断刻意放在装 Flutter **之前**：被跳过的 PR 只花 checkout 与约 1 秒。
      # 判据用 python 而非 dart，正因为此刻还没有 SDK —— `ubuntu-latest` 自带 python3。
      - name: 判改动面
        id: scope
        run: python3 tool/ci/affected.py --scope app --base "$BASE" >> "$GITHUB_OUTPUT"
        env:
          # PR 用 base.sha、push 用 before；都**不写死** `origin/main` ——
          # push 到 main 时 `origin/main` 已经是新 HEAD，差值恒为空。
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # 版本与本地环境钉死同一组：Flutter 3.47.7 = Dart 3.13.5，
      # 与 app/pubspec.yaml 的 `environment.sdk: 3.13.5` 精确对应。
      # 改这里必须同时改 pubspec 与 docs/guides/environment.md，三处任一不同步
      # 都会让「本地绿、CI 红」或反过来。
      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.run == 'true'
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 依赖
        if: steps.scope.outputs.run == 'true'
        run: flutter pub get

      - name: 静态分析
        if: steps.scope.outputs.run == 'true'
        run: flutter analyze

      - name: 架构规则（core 不变量）
        if: steps.scope.outputs.run == 'true'
        run: dart run tool/lint/check.dart

      # 交付物之间的口径对账：`STD` 说多少条、`STP` 汇总多少条、`SCMP` §5.1 登记
      # 什么版号 —— 必须是同一个数。`analyze` 与 `tool/lint` 都**看不见**这类错，
      # 它们只看 Dart 源码，而这四份是 Markdown。
      # 为什么非有这一步：同一读数散在四份文件 4–13 处、措辞各异（「`Dart` 用例 561
      # 条」/「584 → **597** 条」/「`v0.47.0` | 1 |」），批量替换不可能，漏改只能靠
      # 人眼。实测漏过两次：`SCMP` 修订历史漏了 `v0.45.0` 整行、`STD` §4.1 按域表
      # 连续两版没跟。本步首次接入时当场抓出 4 处（分段 592 vs 合计 597 等）。
      - name: 交付物一致性（口径对账）
        if: steps.scope.outputs.run == 'true'
        run: dart run tool/docs/check.dart

      # 定位引擎与加载器的用例读的是**真实产物**（`content/<空间>/dist/pack.json`），
      # 而 `dist/` 不入库（`SPEC-PACK-018`）⇒ 这里现场构建一遍。
      # **不指定空间**：哪个空间有源数据就构建哪个，与本地一致。只构建 python 的
      # 后果是 CI 上「多根」退化成单根，那条 `english / german 各自装得出` 会红 ——
      # 而「CI 只验了一个包」这件事本身也不会有人发现。
      # 正因为它读 `content/`，`scopes.json` 里 `app` 的输入闭包才含 `content/`。
      - name: 构建内容包（测试输入）
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: python3 content/tools/build.py

      - name: 单元测试
        if: steps.scope.outputs.run == 'true'
        run: flutter test --reporter compact
