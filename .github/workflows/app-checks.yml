name: app-checks

# Client-side architecture gate. Four things are enforced here instead of
# relying on "remember to run it by hand":
#   1. analyze    -- strict mode (strict-casts / strict-inference / strict-raw-types)
#   2. tool/lint  -- architectural invariants of core: R1 the core layer must not
#                    depend upwards, R2 no numeric literals in core. It is a
#                    standalone script, not a custom_lint plugin, so **analyze
#                    does not catch it**; dropping this line leaves "core imports
#                    no Flutter" as a statement that exists only in docs.
#   3. tool/docs  -- reconciles figures across the four deliverables (`D1`-`D4`).
#                    Both analyze and tool/lint read Dart source only and cannot
#                    see errors such as "STD says N rules, STP summarises M" --
#                    and those four are Markdown.
#   4. test       -- regression for core, entities, events and the lint rules themselves
#
# `dart format --set-exit-if-changed` is deliberately absent: the repo is not
# format-clean today (a real run would rewrite 12 of 17 files, likely tied to
# the Dart 3.7+ tall style). Formatting must land in its own commit first,
# otherwise this job is red from day one -- and a permanently red gate is no
# gate at all.
#
# -- Why there is NO `paths:` filter ------------------------------------------
# The trigger surface is decided inside the job by `tool/ci/affected.py`, not on
# the workflow. Not a style preference: when `paths` does not match, the whole
# workflow does NOT run, so the check produces NO conclusion; once branch
# protection marks it required, a docs-only PR sits at
# "Expected -- Waiting for status to be reported" forever and cannot merge.
# As written the job always runs and always reports success, skipping happens
# inside steps -- required or not, it works either way.

on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest run per branch so nobody queues behind old commits.
concurrency:
  group: app-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: app-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # Computing the change surface needs the merge-base of `base...HEAD`,
          # which the default `depth: 1` cannot provide. Without it the script
          # degrades to "run everything" -- no missed check, but the criterion
          # becomes vacuous, so this must be 0.
          fetch-depth: 0

      # The criterion proves itself before judging others: when `scopes.json` is
      # narrowed (say `content/` dropped), the run still "works", it just always
      # answers "not affected" -- the worst failure mode. This self-test is a
      # plain assertion, no git, about 0.2 s.
      - name: 判据自检
        run: python3 tool/ci/affected.py --self-test

      # Deliberately before installing Flutter: a skipped PR only pays checkout
      # plus about a second. It uses python rather than dart precisely because
      # there is no SDK yet -- `ubuntu-latest` ships python3.
      - name: 判改动面
        id: scope
        run: python3 tool/ci/affected.py --scope app --base "$BASE" >> "$GITHUB_OUTPUT"
        env:
          # PR uses base.sha, push uses before; never hardcode `origin/main` --
          # on a push to main `origin/main` is already the new HEAD and the diff
          # is always empty.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # Version pinned to the same pair as the local environment:
      # Flutter 3.47.7 = Dart 3.13.5, matching `environment.sdk: 3.13.5` in
      # app/pubspec.yaml exactly. Changing this means also changing pubspec and
      # docs/runbooks/environment.md; any desync turns into "green locally, red
      # in CI" or the reverse.
      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.run == 'true'
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 依赖
        if: steps.scope.outputs.run == 'true'
        run: flutter pub get

      - name: 静态分析
        if: steps.scope.outputs.run == 'true'
        run: flutter analyze

      - name: 架构规则（core 不变量）
        if: steps.scope.outputs.run == 'true'
        run: dart run tool/lint/check.dart

      # Reconciles figures across deliverables: how many rules `STD` claims, how
      # many `STP` summarises, which version `SCMP` §5.1 records -- one single
      # number. Both analyze and tool/lint are blind to this class of error;
      # they read Dart source while these four are Markdown.
      # Why the step exists: the same reading appears in 4-13 places across four
      # files in different wording ("561 Dart cases" / "584 -> **597**" /
      # "`v0.47.0` | 1 |"), so bulk replacement is impossible and misses need
      # human eyes. It has missed twice for real: `SCMP` revision history lost
      # the whole `v0.45.0` row, and `STD` §4.1 per-domain table lagged two
      # versions in a row. On first wiring it caught 4 discrepancies at once
      # (sections 592 vs total 597, etc.).
      - name: 交付物一致性（口径对账）
        if: steps.scope.outputs.run == 'true'
        run: dart run tool/docs/check.dart

      - name: 基线登记与文档预算
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 ../infra/tool/docs/audit.py all --root ..
          python3 -m unittest discover -s ../infra/tool/docs/tests

      # The tests read the REAL artifact `content/<space>/pack.json` (single-file
      # form since `B14`), which is not committed (`SPEC-PACK-018`), so assemble
      # it here. Without this step `real_content_pack_test.dart` fails
      # (**not skip**: skipping would make "forgot to assemble" look green).
      #
      # All four run, for different reasons:
      #   - `assemble_pack.py` produces the target form `pack.json`, the input to
      #     the client tests;
      #   - `assemble_skeleton.py` produces the skeleton pack
      #     `content/skeleton/pack.json`, also a test input
      #     (`real_content_pack_test.dart` verifies it separately from the
      #     payload pack);
      #   - `assemble_terrain.py` produces `content/terrain/pack.json`. It must
      #     run **after** the two above: terrain edges point at nodes in other
      #     packs, so the assembler reads `python/pack.json` and
      #     `skeleton/pack.json` to derive `axes_covered`. Missing those inputs
      #     it fails instead of guessing an axis.
      #   - `build.py` produces the obsolete form `dist/pack.json`; running it
      #     verifies "old source data is still accepted by the old validator" --
      #     problems in the source data are reported there, the assembler only
      #     moves bytes. `build.py` and its fixtures are deleted with the
      #     pipeline migration.
      #
      # **No space argument**: build whichever space has source data, same as
      # locally. Building python only would silently degrade "multiple roots"
      # to a single root in CI, and nobody would notice that "CI verified only
      # one pack". Because these read `content/`, the input closure of `app` in
      # `scopes.json` includes `content/`.
      - name: 构建内容包（测试输入）
        if: steps.scope.outputs.run == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          python3 content/tools/build.py
          python3 content/tools/assemble_pack.py
          python3 content/tools/assemble_skeleton.py
          python3 content/tools/assemble_terrain.py

      - name: 单元测试
        if: steps.scope.outputs.run == 'true'
        run: flutter test --reporter compact
