name: repo-hygiene

# 全仓级的仓级判据：**不判「该不该跑」**（刻意不设 `paths`，每次都有结论）。
# 目前四条：构建产物不得入库 · 提交信息格式 · PR 正文形态 · main 只接受 PR。
#
# 为什么不并进 `content-checks`：那支的改动面是 `content/`，只改 `app/` 的 PR
# 不触发它，而「有没有把 `dist/` 提交进去」跟改哪个目录无关 —— 挂着走就会漏。
# 也不设 `paths`：它只要 `git`，整段约 5 秒，是这里最便宜的判据。
# 便宜的判据不该被贵的 job 拖着，也不该为它引入跳过逻辑。

on:
  push:
    branches: [main]
  pull_request:
    # 本 job 读的是 PR 正文；改正文只发 `edited`，不发 `synchronize`。
    # 缺这一项时「改正文后重跑」只有 rerun 一条路，而 rerun 重放的是**开 PR 时**
    # 的事件 payload ⇒ 判据一直指着旧正文，改了不起作用。
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` 是「提交信息」那一步需要的：它要按 `base..head` 算区间，
      # 默认浅克隆（depth=1）里 `base` 根本不在对象库里，`git log` 会直接报错。
      # 这个仓库总量不大，拉全历史的代价远小于「判据报一条与提交信息无关的错」。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 判据只针对产物路径。原写法「全仓不得有未跟踪文件」有两处失真：
      #   过宽 —— 任何与产物无关的临时文件都会让它红，错误信息还指向 dist/；
      #   过窄 —— ^?? 只匹配未跟踪文件，dist/ 若已被提交进库，status 显示的是 M
      #           （甚至无变化时不显示），它反而漏掉自己最该抓的情况。
      # 判据工具按 .gitignore 纪律 ③：以 `git add -A --dry-run` 为准（新增与修改都会
      # 列出，被忽略的不列），再用 ls-files 补「已提交进库但未改动」这一路。
      # ⚠️ 不用 pathspec 通配：实测 `git status -- 'content/*/dist'` 拿不到未跟踪目录
      #    （全量 status 有 `?? .../dist/`，加通配后返回空，`:(glob)` 同样无效），
      #    会静默放行。故取全量输出再文本过滤。
      #
      # 本 job **不构建**，所以原来在 `content-checks` 里「构建完再看 dry-run」
      # 那一半在这里恒为空 —— 用 `check-ignore` 换成等价的静态判据（路径不必存在）。
      # 不做这一步，拆出来就是功能退化。
      - name: 产物不入库
        run: |
          fail=0

          for m in content/*/manifest.json; do
            [ -e "$m" ] || continue
            d="$(dirname "$m")/dist"
            # ⚠️ 查询必须**带尾斜杠**。`content/*/dist/` 是目录规则，而 CI 是干净
            # checkout、`dist/` 根本不存在；路径不存在时 git 无法 stat 出「这是目录」，
            # 不带斜杠的查询会返回**未命中**。本地因为目录真实存在反而测不出来 ——
            # 本文件第一次推送就是三处全 FAIL，红的正是这个。
            if git check-ignore -q -- "$d/"; then
              echo "ok   $d/ 已被 .gitignore 覆盖"
            else
              echo "FAIL $d/ 未被 .gitignore 覆盖：构建产物会被提交进库"
              fail=1
            fi
          done

          tracked=$(git ls-files | grep -E '(^|/)dist/' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL 构建产物已在索引中，应移除并补 .gitignore："
            echo "$tracked"
            fail=1
          fi

          pending=$(git add -A --dry-run | grep -E '(^|/)dist/' || true)
          if [ -n "$pending" ]; then
            echo "FAIL 构建产物会被提交进库（未被 .gitignore 覆盖）："
            echo "$pending"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "产物未入库：dist/ 均被 .gitignore 覆盖"

      # ── 提交信息格式 ────────────────────────────────────────────────
      # 判据在 `.githooks/commit-msg`，与本地 `commit-msg` hook **同一个文件**。
      # 分两份的后果很具体：本地放行、CI 红，人去改 CI 而不是改提交；反过来
      # CI 放行、本地红，人会 `--no-verify`。判据一旦有两份，就等于没有判据。
      #
      # 为什么在这里而不在 `app-checks`：这条判据与改哪个目录无关，且只要 git
      # 与 bash，约 1 秒。挂在需要装 Flutter 的 job 上，会让它随 SDK 安装排队。
      #
      # ⚠️ 区间按事件类型分别取。`pull_request` 用 base..head（PR 独有提交）；
      #    `push` 用 before..after。新分支首推时 `before` 是全 0，脚本内部会
      #    退化成「只看 after 这一条」—— 这个判断放在脚本里，不放在 YAML 里，
      #    免得本地与 CI 各有一份区间逻辑。
      - name: 提交信息
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.event.after }}"
          fi
          echo "区间：$range"
          bash .githooks/commit-msg --range "$range"

      # ── PR 正文形态 ────────────────────────────────────────────────
      # 判据在 `.githooks/pr-body`，与本地自检**同一个文件**（沿用上段那条：
      # 「判据一旦有两份，就等于没有判据」）。
      #
      # 为什么需要这一步：`#143` ~ `#147` 五笔正文全部违规，且**同一个错重复五次**
      # —— `如实登记` 用 ①②③ 压在同一个段落里。当时这一环**没有任何装置**：模板
      # 那行是单行占位（照它填必然压段）、`gh pr create` 不校验正文、`commit-msg`
      # 只管提交信息。规则只活在 `git-conventions` §4.1 正文里，读它才生效 ⇒ 连续
      # 失效五次。
      #
      # ⚠️ 这段原写作「…**且** `改动面` 跨两个技术栈目录却没列三列表」，**是错的**：
      #    技术栈目录只含 `app/` `server/` `content/` `infra/`（§4.1 原文），五笔里
      #    `#143`/`#145` 只动 `docs/`、`#144`/`#146`/`#147` 各只动 1 个技术栈目录 ⇒
      #    没有一笔达到表格条件。曾据这个错判给三笔各补了一张表 —— **表是多加的**，
      #    与「逐项一行」两档口径不符，见 §4.1 末条。
      #
      # ⚠️ 只在 `pull_request` 事件跑：`pull_request.body` 只有那里有。
      # ⚠️ 正文经 env 传入、不拼进 `run:` —— 正文里的引号 / 反引号 / `$` 会把 shell 拆坏。
      # ⚠️ `--diff-base` 不可省：跨栈三列表与 `改动面` 的 **N 对账**都靠**真实 diff**，
      #    不认正文自述 —— 后者是全装置唯一一处判「真假」的判据（其余只判形态）。
      #    checkout 已是 `fetch-depth: 0`，再取一次 base 分支就能算三点 diff。
      - name: PR 正文形态
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          bash .githooks/pr-body --file "$body" --diff-base "origin/${{ github.event.pull_request.base.ref }}"

      # ── main 只接受 PR ──────────────────────────────────────────────
      # 判据在 `.githooks/pre-push`，与本地 hook **同一个文件**、同一个 `--range` 入口。
      # 本地那端让 `git push` 当场失败；这端让「已经推上去的直推」留下红灯 ——
      # 远端分支保护在本账号的私有仓不可用（§4.3），近端两道是唯一替代装置。
      #
      # ⚠️ 只在 `push` 事件跑：PR 事件的 head 是特性分支，那上面的提交本就没有
      #    `(#NNN)`（编号是合入时才写上去的），拿这条判据去卡 PR 必然全红。
      # ⚠️ 本步骤校验不到 tag：`on.push` 只挂 `branches: [main]`，推 tag 不触发
      #    workflow。tag 判据只有近端一道，见 `.githooks/pre-push` 的注释。
      - name: main 只接受 PR
        if: github.event_name == 'push'
        run: |
          echo "区间：${{ github.event.before }}..${{ github.event.after }}"
          bash .githooks/pre-push --range "${{ github.event.before }}..${{ github.event.after }}"
