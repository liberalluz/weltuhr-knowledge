name: repo-hygiene

# Repo-wide hygiene criteria: **it never decides whether to run** (no `paths` on
# purpose, so every run produces a conclusion).
# Four today: build artifacts stay out of the repo; commit message format; PR
# body shape; main only accepts PRs.
#
# Why not fold this into `content-checks`: that job's change surface is
# `content/`, so a PR touching only `app/` does not trigger it, while "did
# anyone commit `dist/`" has nothing to do with which directory changed --
# riding along with it means missing it.
# No `paths` either: it needs only `git`, takes about 5 s, and is the cheapest
# criterion here. A cheap criterion should not be dragged behind an expensive
# job, nor grow skip logic of its own.

on:
  push:
    branches: [main]
  pull_request:
    # This job reads the PR body; editing the body fires only `edited`, never
    # `synchronize`. Without that type, "rerun after editing" has only the
    # rerun button, and a rerun replays the event payload from **when the PR
    # was opened** -- the criterion keeps pointing at the old body and edits
    # have no effect.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` is required by the commit-message step: it computes a
      # `base..head` range, and in a shallow clone (depth=1) `base` is simply
      # not in the object database, so `git log` errors out. The repo is small;
      # fetching full history costs far less than reporting an error unrelated
      # to commit messages.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The criterion targets artifact paths only. The earlier form, "no
      # untracked files anywhere", was wrong in two directions:
      #   too wide  -- any temp file unrelated to artifacts turned it red, with
      #               an error message pointing at dist/;
      #   too narrow -- `^??` matches untracked files only, so if dist/ was
      #               already committed, status shows M (or nothing when
      #               unchanged) and it misses exactly its own worst case.
      # The tool follows .gitignore discipline 3: trust `git add -A --dry-run`
      # (new and modified files are listed, ignored ones are not), then use
      # ls-files to cover "committed to the index but unchanged".
      # WARNING: no pathspec globbing -- measured that
      # `git status -- 'content/*/dist'` cannot see untracked directories (the
      # full status shows `?? .../dist/` while the globbed call returns empty,
      # and `:(glob)` does not help), so it would silently pass. Hence: take the
      # full output and filter as text.
      #
      # This job does **not build**, so the half that used to live in
      # `content-checks` ("build first, then inspect dry-run") is always empty
      # here -- `check-ignore` replaces it with an equivalent static criterion
      # (the path need not exist). Skipping this step would make the split a
      # functional regression.
      - name: 产物不入库
        run: |
          fail=0

          for m in content/*/manifest.json; do
            [ -e "$m" ] || continue
            d="$(dirname "$m")/dist"
            # WARNING: the query must carry a trailing slash. `content/*/dist/`
            # is a directory rule, and CI is a clean checkout where `dist/`
            # does not exist; without the directory present git cannot stat
            # "this is a directory" and a slashless query returns **no match**.
            # Locally the directory exists, so the bug is invisible -- the first
            # push of this file failed all three checks for exactly this reason.
            if git check-ignore -q -- "$d/"; then
              echo "ok   $d/ 已被 .gitignore 覆盖"
            else
              echo "FAIL $d/ 未被 .gitignore 覆盖：构建产物会被提交进库"
              fail=1
            fi
          done

          tracked=$(git ls-files | grep -E '(^|/)dist/' || true)
          if [ -n "$tracked" ]; then
            echo "FAIL 构建产物已在索引中，应移除并补 .gitignore："
            echo "$tracked"
            fail=1
          fi

          pending=$(git add -A --dry-run | grep -E '(^|/)dist/' || true)
          if [ -n "$pending" ]; then
            echo "FAIL 构建产物会被提交进库（未被 .gitignore 覆盖）："
            echo "$pending"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "产物未入库：dist/ 均被 .gitignore 覆盖"

      # -- Commit message format ----------------------------------------------
      # The criterion lives in `.githooks/commit-msg`, the **same file** the
      # local `commit-msg` hook runs. Splitting it has a concrete cost: local
      # passes, CI fails, people edit CI instead of the commit; CI passes, local
      # fails, people reach for `--no-verify`. Two copies of a criterion mean no
      # criterion.
      #
      # Why here and not in `app-checks`: this criterion is independent of which
      # directory changed and needs only git and bash, about 1 s. Hanging it on
      # a job that installs Flutter would queue it behind an SDK download.
      #
      # WARNING: the range is chosen per event type. `pull_request` uses
      # base..head (the PR's own commits); `push` uses before..after. On a new
      # branch's first push `before` is all zeros and the script degrades to
      # "check the one after commit" -- that decision lives in the script rather
      # than the YAML so local and CI never hold two copies of the range logic.
      - name: 提交信息
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.event.after }}"
          fi
          echo "区间：$range"
          bash .githooks/commit-msg --range "$range"

      # -- PR body shape ------------------------------------------------------
      # The criterion lives in `.githooks/pr-body`, the **same file** the local
      # self-check runs (same rule as above: two copies of a criterion mean no
      # criterion).
      #
      # Why the step is needed: five consecutive PR bodies (`#143`-`#147`) all
      # violated it and **repeated the same mistake five times** -- `如实登记`
      # packed into one paragraph with circled numbers. At the time this link had
      # **no mechanism at all**: the template row was a single-line placeholder
      # (filling it as written forces packing), `gh pr create` does not validate
      # the body, and `commit-msg` only owns commit messages. The rule lived in
      # prose inside `git-conventions` §4.1 and only worked if read => it failed
      # five times in a row.
      #
      # WARNING: this paragraph used to say "...**and** `改动面` crossed two tech
      #      stack directories without a three-column table", **which was wrong**:
      #      tech stack directories are only `app/` `server/` `content/` `infra/`
      #      (§4.1), and of those five `#143`/`#145` touched only `docs/` while
      #      `#144`/`#146`/`#147` each touched one stack directory => none met the
      #      table condition. Acting on that wrong reading added a table to three
      #      PRs -- **the tables were spurious**, contradicting the "one line per
      #      item" form; see the last entry of §4.1.
      #
      # WARNING: runs only on `pull_request` -- `pull_request.body` exists only
      #          there.
      # WARNING: the body is passed via env, never interpolated into `run:` --
      #          quotes / backticks / `$` in the body would break the shell.
      # WARNING: `--diff-base` is not optional: the cross-stack table and the
      #          **N reconciliation** of `改动面` rely on the **real diff**, not on
      #          what the body claims -- the only place in the whole mechanism
      #          that judges true/false (everything else judges shape).
      #          checkout already has `fetch-depth: 0`, so one more fetch of the
      #          base branch is enough for a three-dot diff.
      - name: PR 正文形态
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          bash .githooks/pr-body --file "$body" --diff-base "origin/${{ github.event.pull_request.base.ref }}"

      - name: PR 批次号与分支
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY", "")
          ref = os.environ.get("HEAD_REF", "")
          match = re.search(r"(?m)^- 批次号：\s*`?([^`\s]+)`?\s*$", body)
          if not match:
              print("FAIL 正文缺少 - 批次号", file=sys.stderr)
              sys.exit(1)
          batch = match.group(1)
          if not ref.endswith("/" + batch):
              print(f"FAIL 正文批次号 {batch} 与分支 {ref} 不一致", file=sys.stderr)
              sys.exit(1)
          print(f"ok 批次号 {batch} 与分支 {ref} 一致")
          PY

      # -- 关联节八项 --------------------------------------------------------
      # `.githooks/pr-body` owns the shape of this section: the eight-class closed
      # set, one class per line, the fixed order, and the rule that a class
      # without an anchor does not appear at all (a class written as `无` is the
      # violation). This step judges what shape cannot see -- a required class
      # that never appeared. The requirement comes from facts outside the body
      # (the diff, the platform), never from the body itself, so "I forgot to
      # list it" is decidable:
      #        diff touches app/test or the controlled ledger -> 用例
      #        diff touches a spec volume (docs/specs/<UP>-*.md) -> 规格条
      #        diff touches docs/decisions                      -> ADR
      #        diff adds a `[#N](.../pull/N)` link              -> PR
      #        diff adds `TODO(confirm):`                       -> 待确认事项
      #        a commit carries `Milestone: <id>` trailer       -> 里程碑
      #        the PR closes issues                             -> issue
      #
      # WARNING: `批次号` is not repeated here -- the step above already owns it.
      # WARNING: the body is passed via env, never interpolated into `run:`.
      # WARNING: `gh` needs GH_TOKEN here; without PR context (local runs, push
      #          events) the issue half is skipped rather than guessed.
      - name: 关联节八项
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def run(cmd):
              p = subprocess.run(cmd, capture_output=True, text=True)
              if p.returncode != 0:
                  print(f"FAIL 命令失败：{' '.join(cmd)}", file=sys.stderr)
                  print((p.stderr or "").strip()[-2000:], file=sys.stderr)
                  sys.exit(1)
              return p.stdout

          body = os.environ.get("PR_BODY", "")
          base = os.environ.get("BASE_REF", "main")
          number = os.environ.get("PR_NUMBER", "")

          CLASSES = ["批次号", "里程碑", "issue", "PR", "ADR", "规格条", "用例", "待确认事项"]

          section, inside = [], False
          for line in body.splitlines():
              if line.strip() == "## 关联":
                  inside = True
                  continue
              if inside and line.startswith("## "):
                  break
              if inside:
                  section.append(line)

          entries = {}
          for line in section:
              m = re.match(r"^- ([^：]+)：(.*)$", line.strip())
              if not m:
                  continue
              key, val = m.group(1).strip(), m.group(2).strip()
              if key in CLASSES:
                  entries.setdefault(key, []).append(val)

          errors = []

          def need(key, why):
              if key not in entries:
                  errors.append(f"缺 `- {key}：` —— {why}")

          names = run(["git", "diff", "--name-only", f"origin/{base}...HEAD"]).splitlines()
          patch = run(["git", "diff", "-U0", f"origin/{base}...HEAD"]).splitlines()
          added = [l[1:] for l in patch if l.startswith("+") and not l.startswith("+++")]

          if any(p.startswith(("app/test/", "docs/specs/controlled/")) for p in names):
              need("用例", "本次改动含测试文件或受控用例台账")
          if any(re.match(r"docs/specs/[A-Z]+-", p) for p in names):
              # SPEC 条住在 `docs/specs/<大写前缀>-*.md` 的规格卷里；
              # `git-conventions.md` 这类工程规范没有 SPEC 条编号，改它不要求
              # 关联节出现 `- 规格条：`。
              need("规格条", "本次改动含规格卷（docs/specs/<大写前缀>-*.md）")
          if any(p.startswith("docs/decisions/") for p in names):
              need("ADR", "本次改动含 docs/decisions/ 下的决策文件")
          if any(re.search(r"\[#\d+\]\(https://github\.com/[\w.-]+/[\w.-]+/pull/\d+\)", a) for a in added):
              need("PR", "本次新增行引用了其它 PR 的显示链接")
          # 标记必须落在注释语境里（`# TODO(confirm):` 或 `// TODO(confirm):`）：
          # 裸词会被规则文本自己命中 —— 本文件与 `git-conventions` 都在描述它。
          if any(re.search(r"(?:^|\s)(?:#|//)\s*TODO\(confirm\):", a) for a in added):
              need("待确认事项", "本次新增行含 `# TODO(confirm):` 注释")

          trailers = sorted(
              {
                  t.strip()
                  for t in run(
                      ["git", "log", "--format=%(trailers:key=Milestone,valueonly)", f"origin/{base}..HEAD"]
                  ).splitlines()
                  if t.strip()
              }
          )
          if trailers:
              if "里程碑" not in entries:
                  errors.append(
                      f"提交带 `Milestone: {'/'.join(trailers)}` trailer，正文缺 `- 里程碑：`"
                  )
              else:
                  written = " ".join(entries["里程碑"])
                  for t in trailers:
                      if t not in written:
                          errors.append(f"trailer 的里程碑 {t} 不在正文 `- 里程碑：` 行里")
          elif "里程碑" in entries:
              errors.append("正文写了 `- 里程碑：`，但区间内提交没有 `Milestone:` trailer")

          if number:
              raw = run(["gh", "pr", "view", number, "--json", "closingIssuesReferences"])
              try:
                  closed = {
                      str(item["number"])
                      for item in (json.loads(raw or "{}").get("closingIssuesReferences") or [])
                  }
              except (ValueError, KeyError, TypeError):
                  closed = set()
              if closed:
                  if "issue" not in entries:
                      errors.append(
                          f"本 PR 关了 issue {'/'.join('#' + n for n in sorted(closed))}，正文缺 `- issue：`"
                      )
                  else:
                      found = set(re.findall(r"#(\d+)", " ".join(entries["issue"])))
                      missing = closed - found
                      if missing:
                          errors.append(
                              "`- issue：` 行未含 "
                              + " ".join("#" + n for n in sorted(missing))
                          )

          if errors:
              for item in errors:
                  print(f"FAIL {item}")
              sys.exit(1)
          print("ok  关联节八项：无漏列（形态由 .githooks/pr-body 判）")
          PY

      # -- main only accepts PRs ----------------------------------------------
      # The criterion lives in `.githooks/pre-push`, the **same file** and the
      # same `--range` entry point as the local hook. Locally it makes `git push`
      # fail on the spot; here it leaves a red mark on any direct push that
      # already happened. Branch protection is enforced by the ruleset (§4.3);
      # these two near-end gates are defence in depth.
      #
      # WARNING: runs only on `push` -- on a PR event the head is a feature
      #          branch whose commits carry no `(#NNN)` yet (the number is written
      #          at merge time), so applying this criterion to a PR is always red.
      # WARNING: this step cannot check tags: `on.push` covers only
      #          `branches: [main]`, and pushing a tag triggers no workflow. The
      #          tag criterion exists near-end only; see the notes in
      #          `.githooks/pre-push`.
      - name: main 只接受 PR
        if: github.event_name == 'push'
        run: |
          echo "区间：${{ github.event.before }}..${{ github.event.after }}"
          bash .githooks/pre-push --range "${{ github.event.before }}..${{ github.event.after }}"
