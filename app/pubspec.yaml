name: project_knowledge
description: "Weltuhr — 知识体系学习软件"
publish_to: 'none'
version: 0.1.0+1

# 版本钉死：不用 ^ 区间（docs/runbooks/environment.md §一）。升级须走变更控制。
environment:
  sdk: 3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.9
  # 3D 渲染栈（`ADR-0006`）。0.24 起 Flutter GPU 须显式开启 —— 三端各改一处，
  # 见 `windows/runner/main.cpp` 与两个 `Info.plist`。
  flutter_scene: 0.24.3
  # 下面两个是 spike 直接 import 的，虽由 `flutter_scene` 传递引入，仍显式声明：
  # `hooks` 是 `hook/build.dart` 的宿主，`vector_math` 是场景变换用的向量类型。
  hooks: 2.2.0
  vector_math: 2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  # 仅供 tool/lint/ 的架构规则检查使用（解析 AST）；运行时零依赖。
  analyzer: 14.5.0

flutter:
  assets:
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  uses-material-design: true
